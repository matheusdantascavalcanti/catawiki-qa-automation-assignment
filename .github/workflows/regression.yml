name: Manual browser regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.project }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }} tests
        id: browser-test
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload ${{ matrix.project }} failure evidence
        if: ${{ !cancelled() && steps.browser-test.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: regression-${{ matrix.project }}-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
