name: Phase 04 CI feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    name: GitHub-hosted Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record runner and runtime versions
        run: |
          echo "Runner: $(lsb_release --description --short) ($(uname --machine))"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright-managed Chromium
        run: npx playwright install --with-deps chromium

      - name: Record Playwright browser installation
        run: |
          npx playwright --version
          node --input-type=module --eval "import { chromium } from '@playwright/test'; console.log('Managed Chromium executable: ' + chromium.executablePath());"

      - name: Run the real committed smoke test once
        id: smoke
        env:
          CI: ''
          CI_FEASIBILITY_EVIDENCE: '1'
          DEBUG: pw:browser
        run: npm run test:smoke -- --workers=1 --retries=0 --reporter=line,html

      - name: Preserve failed feasibility evidence
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-04-feasibility-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 3
